<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trabalhos Escolares</title>


    <style>

        /* ==================================================
           VARIÁVEIS
        ================================================== */

        :root {

            --blue: #0878d1;

            --blue-light: #6aa8ff;

            --green: #00a889;

            --green-dark: #007d70;

            --background: #202526;

            --background-dark: #111313;

            --card: #111111;

            --card-light: #181919;

            --border: #343a3b;

            --text: #d4e0eb;

            --text-muted: #8996a2;

            --danger: #b53a3a;

            --warning: #f0b429;

        }



        /* ==================================================
           RESET
        ================================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }



        /* ==================================================
           BODY
        ================================================== */

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(8, 120, 209, 0.08),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }



        /* ==================================================
           TOPO
        ================================================== */

        .topbar {

            width: 100%;

            min-height: 105px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 5%;

            background:
                linear-gradient(
                    110deg,
                    #0878d1,
                    #0796ad,
                    #00a889
                );

            border-bottom: 1px solid
                rgba(255,255,255,.08);

        }



        /* ==================================================
           LOGO
        ================================================== */

        .school-logo {

            height: 82px;

            display: flex;

            align-items: center;

        }



        .school-logo img {

            height: 78px;

            width: auto;

            max-width: 250px;

            object-fit: contain;

        }



        /* ==================================================
           ADMIN
        ================================================== */

        .admin-button {

            border: none;

            border-radius: 30px;

            padding: 15px 26px;

            background: #101313;

            color: #00c59e;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform .2s,
                background .2s,
                color .2s;

        }



        .admin-button:hover {

            transform: translateY(-2px);

            background: #080909;

            color: #5ee6c4;

        }



        /* ==================================================
           LAYOUT
        ================================================== */

        .layout {

            width: 100%;

            max-width: 1500px;

            margin: 0 auto;

            padding: 30px;

            display: grid;

            grid-template-columns:
                190px
                minmax(0, 1fr)
                220px;

            gap: 25px;

        }



        /* ==================================================
           MENU ESQUERDO
        ================================================== */

        .left-sidebar {

            padding-top: 10px;

        }



        .main-navigation {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }



        .nav-button {

            width: 100%;

            padding: 16px 12px;

            border: none;

            border-radius: 12px;

            background: transparent;

            color: #aebdca;

            font-size: 16px;

            font-weight: bold;

            text-align: left;

            cursor: pointer;

            transition:
                background .2s,
                color .2s,
                transform .2s;

        }



        .nav-button:hover {

            background:
                rgba(0, 168, 137, .12);

            color: white;

        }



        .nav-button.active {

            background:
                rgba(0, 168, 137, .20);

            color: #52d5b8;

        }



        /* ==================================================
           CONTEÚDO
        ================================================== */

        .main-content {

            min-width: 0;

        }



        /* ==================================================
           BOTÃO ADICIONAR
        ================================================== */

        .add-work-button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 18px;

            background:
                linear-gradient(
                    100deg,
                    var(--blue),
                    var(--green)
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(0, 130, 170, .15);

            transition:
                transform .2s,
                filter .2s;

        }



        .add-work-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.08);

        }



        /* ==================================================
           FORMULÁRIO
        ================================================== */

        .work-form {

            display: none;

            margin-top: 18px;

            padding: 25px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 18px;

        }



        .work-form.visible {

            display: block;

        }



        .work-form h2 {

            margin-bottom: 22px;

            color: var(--blue-light);

            font-size: 24px;

        }



        .form-section {

            margin-bottom: 20px;

        }



        .form-section label {

            display: block;

            margin-bottom: 8px;

            color: #b8c8d7;

            font-size: 14px;

            font-weight: bold;

        }



        /* ==================================================
           TIPOS
        ================================================== */

        .type-buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

        }



        .type-button {

            border: 1px solid var(--border);

            border-radius: 10px;

            padding: 15px;

            background: var(--card-light);

            color: #b7c6d4;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                border .2s,
                background .2s,
                color .2s;

        }



        .type-button:hover {

            border-color: var(--green);

        }



        .type-button.selected {

            background:
                rgba(0, 168, 137, .18);

            border-color: #00c7a5;

            color: #4edabd;

        }



        /* ==================================================
           CAMPOS
        ================================================== */

        .work-fields {

            display: none;

        }



        .work-fields.visible {

            display: block;

        }



        #textField,
        #imageField,
        #videoField {

            display: none;

        }



        #textField.visible,
        #imageField.visible,
        #videoField.visible {

            display: block;

        }



        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid var(--border);

            border-radius: 9px;

            background: #181919;

            color: white;

            outline: none;

            font-family: inherit;

            font-size: 15px;

            transition:
                border .2s,
                box-shadow .2s;

        }



        input,
        select {

            height: 46px;

            padding: 0 13px;

        }



        textarea {

            min-height: 180px;

            padding: 13px;

            resize: vertical;

        }



        input:focus,
        select:focus,
        textarea:focus {

            border-color: var(--blue);

            box-shadow:
                0 0 0 2px
                rgba(8,120,209,.15);

        }



        select {

            cursor: pointer;

        }



        select option {

            background: #181919;

            color: white;

        }



        /* ==================================================
           PARTICIPANTES
        ================================================== */

        .participants-container {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }



        .participant-row {

            display: flex;

            gap: 8px;

            align-items: center;

        }



        .participant-row select {

            flex: 1;

        }



        .remove-participant-button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 8px;

            background: #3a2020;

            color: #ff8585;

            font-size: 18px;

            cursor: pointer;

        }



        .remove-participant-button:hover {

            background: #542525;

        }



        .add-participant-button {

            width: 100%;

            margin-top: 10px;

            padding: 11px;

            border: 1px dashed #3f7770;

            border-radius: 9px;

            background: rgba(0,168,137,.08);

            color: #4edabd;

            font-weight: bold;

            cursor: pointer;

        }



        .add-participant-button:hover {

            background: rgba(0,168,137,.15);

        }



        /* ==================================================
           IMAGEM
        ================================================== */

        .image-preview {

            display: none;

            margin-top: 12px;

            max-width: 100%;

            max-height: 350px;

            border-radius: 12px;

            border: 1px solid var(--border);

            object-fit: contain;

        }



        .image-preview.visible {

            display: block;

        }



        /* ==================================================
           PUBLICAR
        ================================================== */

        .publish-button {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background:
                linear-gradient(
                    100deg,
                    #0878d1,
                    #00a889
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                filter .2s,
                transform .2s;

        }



        .publish-button:hover {

            filter: brightness(1.08);

            transform: translateY(-1px);

        }



        .publish-button:disabled {

            opacity: .6;

            cursor: wait;

            transform: none;

        }



        /* ==================================================
           TRABALHOS
        ================================================== */

        .works-section {

            margin-top: 25px;

            display: flex;

            flex-direction: column;

            gap: 18px;

        }



        .work-card {

            background: var(--card);

            border: 1px solid
                rgba(255,255,255,.05);

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.12);

        }



        .work-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;

        }



        .work-author {

            color: #dbe8f4;

            font-size: 20px;

            font-weight: bold;

        }



        .work-participants {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 7px;

        }



        .participant-badge {

            display: inline-block;

            padding: 5px 9px;

            border-radius: 15px;

            background:
                rgba(0,168,137,.12);

            color: #56d9bd;

            font-size: 12px;

            font-weight: bold;

        }



        .work-date {

            margin-top: 6px;

            color: var(--text-muted);

            font-size: 13px;

        }



        .work-type {

            padding: 8px 12px;

            border-radius: 20px;

            background:
                rgba(8,120,209,.15);

            color: #78baff;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;

        }



        .work-text {

            color: #c2d0dc;

            font-size: 17px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;

        }



        .work-image {

            display: block;

            width: 100%;

            max-height: 700px;

            object-fit: contain;

            border-radius: 12px;

            background: #080808;

        }



        .work-video {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            border: none;

            border-radius: 12px;

            background: #000;

        }



        /* ==================================================
           ESTADO VAZIO
        ================================================== */

        .empty-state {

            padding: 50px 25px;

            text-align: center;

            background: var(--card);

            border-radius: 18px;

            border: 1px solid
                rgba(255,255,255,.05);

        }



        .empty-state h1 {

            color: var(--blue-light);

            font-size: 25px;

            margin-bottom: 12px;

        }



        .empty-state p {

            color: var(--text-muted);

            font-size: 16px;

        }



        /* ==================================================
           MENU DIREITO
        ================================================== */

        .right-sidebar {

            padding-top: 10px;

        }



        .filter-title {

            color: #aebdca;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 12px;

        }



        .filter-button {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px 10px;

            margin-bottom: 8px;

            background: transparent;

            color: #aebdca;

            font-size: 14px;

            font-weight: bold;

            text-align: left;

            cursor: pointer;

            transition:
                background .2s,
                color .2s;

        }



        .filter-button:hover {

            background:
                rgba(8,120,209,.12);

            color: white;

        }



        .filter-button.active {

            background:
                rgba(0,168,137,.18);

            color: #4edabd;

        }



        /* ==================================================
           SUBFILTROS
        ================================================== */

        .filter-options {

            display: none;

            margin: 0 0 12px 0;

            padding: 10px;

            background: #171919;

            border: 1px solid var(--border);

            border-radius: 12px;

        }



        .filter-options.visible {

            display: block;

        }



        .filter-options-title {

            color: var(--text-muted);

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 8px;

        }



        .subfilter-button {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 10px;

            margin-bottom: 5px;

            background: transparent;

            color: #b9c6d1;

            text-align: left;

            cursor: pointer;

            font-size: 13px;

        }



        .subfilter-button:hover {

            background: rgba(8,120,209,.12);

            color: white;

        }



        .subfilter-button.active {

            background: rgba(0,168,137,.16);

            color: #4edabd;

            font-weight: bold;

        }



        /* ==================================================
           MODAL ADMIN
        ================================================== */

        .admin-modal {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.72);

            z-index: 1000;

        }



        .admin-modal.visible {

            display: flex;

        }



        .admin-modal-box {

            width: 100%;

            max-width: 400px;

            padding: 28px;

            background: #111313;

            border: 1px solid var(--border);

            border-radius: 18px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.5);

        }



        .admin-modal-box h2 {

            color: var(--blue-light);

            font-size: 24px;

            margin-bottom: 8px;

        }



        .admin-login-description {

            color: var(--text-muted);

            font-size: 14px;

            margin-bottom: 22px;

        }



        .google-login-button {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: white;

            color: #222;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }



        .google-login-button:hover {

            filter: brightness(.95);

        }



        .admin-modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 12px;

        }



        .admin-modal-buttons button {

            flex: 1;

            border: none;

            border-radius: 9px;

            padding: 13px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

        }



        #cancelAdminLogin {

            background: #272b2c;

            color: #b7c3cc;

        }



        #cancelAdminLogin:hover {

            background: #323738;

        }



        /* ==================================================
           CONTROLES ADMIN
        ================================================== */

        .admin-controls {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 20px;

            padding-top: 16px;

            border-top: 1px solid var(--border);

        }



        .admin-controls button {

            border: none;

            border-radius: 8px;

            padding: 10px 15px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform .15s,
                filter .15s;

        }



        .admin-controls button:hover {

            transform: translateY(-1px);

            filter: brightness(1.1);

        }



        .approve-button {

            background: #008f76;

            color: white;

        }



        .edit-button {

            background: #0878d1;

            color: white;

        }



        .delete-button {

            background: var(--danger);

            color: white;

        }



        /* ==================================================
           STATUS
        ================================================== */

        .pending-badge {

            display: inline-block;

            margin-bottom: 15px;

            padding: 7px 10px;

            border-radius: 7px;

            background:
                rgba(240,180,41,.10);

            color: var(--warning);

            font-size: 13px;

            font-weight: bold;

        }



        /* ==================================================
           RESPONSIVIDADE
        ================================================== */

        @media (max-width: 900px) {

            .layout {

                grid-template-columns:
                    150px
                    minmax(0,1fr)
                    180px;

                gap: 15px;

                padding: 20px;

            }



            .school-logo img {

                max-width: 190px;

            }



            .admin-button {

                padding: 12px 18px;

                font-size: 14px;

            }

        }



        @media (max-width: 700px) {

            .topbar {

                min-height: 90px;

                padding: 10px 18px;

                gap: 12px;

            }



            .school-logo {

                height: 65px;

            }



            .school-logo img {

                height: 60px;

                max-width: 150px;

            }



            .admin-button {

                padding: 11px 15px;

                font-size: 12px;

            }



            .layout {

                display: flex;

                flex-direction: column;

                padding: 15px;

            }



            .left-sidebar {

                order: 1;

                padding: 0;

            }



            .main-navigation {

                display: grid;

                grid-template-columns:
                    repeat(3,1fr);

                gap: 7px;

            }



            .nav-button {

                padding: 13px 6px;

                font-size: 13px;

                text-align: center;

            }



            .main-content {

                order: 2;

            }



            .right-sidebar {

                order: 3;

                padding: 0;

            }



            .right-sidebar {

                display: block;

            }



            .filter-button {

                text-align: center;

            }



            .filter-options {

                margin-bottom: 10px;

            }



            .work-card {

                padding: 18px;

            }



            .work-header {

                align-items: flex-start;

                flex-direction: column;

            }



            .work-type {

                align-self: flex-start;

            }



            .type-buttons {

                grid-template-columns: 1fr;

            }

        }



        @media (max-width: 450px) {

            .topbar {

                flex-direction: column;

                justify-content: center;

            }



            .school-logo img {

                max-width: 180px;

            }



            .admin-button {

                width: 100%;

            }



            .work-form {

                padding: 18px;

            }



            .admin-modal-box {

                padding: 20px;

            }



            .admin-controls {

                flex-direction: column;

            }



            .admin-controls button {

                width: 100%;

            }



            .participant-row {

                flex-direction: row;

            }

        }

    </style>

</head>



<body>


<!-- ==================================================
     TOPO
================================================== -->

<header class="topbar">


    <div class="school-logo">

        <img
            src="Logo da escola.png"
            alt="Logo da escola"
        >

    </div>


    <button
        class="admin-button"
        id="adminButton"
    >
        Entrar como administrador
    </button>


</header>



<!-- ==================================================
     ESTRUTURA
================================================== -->

<main class="layout">


    <!-- ==================================================
         MENU ESQUERDO
    ================================================== -->

    <aside class="left-sidebar">


        <nav class="main-navigation">


            <button
                class="nav-button active"
                id="homeButton"
            >
                Início
            </button>


            <button
                class="nav-button"
                id="statisticsButton"
            >
                Estatísticas
            </button>


            <button
                class="nav-button"
                id="instructionsButton"
            >
                Instruções
            </button>


        </nav>


    </aside>



    <!-- ==================================================
         CONTEÚDO CENTRAL
    ================================================== -->

    <section class="main-content">


        <button
            class="add-work-button"
            id="addWorkButton"
        >
            + Adicionar Trabalho
        </button>



        <!-- ==================================================
             FORMULÁRIO
        ================================================== -->

        <div
            class="work-form"
            id="workForm"
        >


            <h2>
                Adicionar Trabalho
            </h2>



            <!-- ==================================================
                 TIPO
            ================================================== -->

            <div class="form-section">

                <label>
                    Tipo de trabalho
                </label>


                <div class="type-buttons">


                    <button
                        type="button"
                        class="type-button"
                        data-type="texto"
                    >
                        📝 Texto
                    </button>


                    <button
                        type="button"
                        class="type-button"
                        data-type="imagem"
                    >
                        🖼️ Imagem
                    </button>


                    <button
                        type="button"
                        class="type-button"
                        data-type="video"
                    >
                        ▶️ Vídeo
                    </button>


                </div>

            </div>



            <div
                class="work-fields"
                id="workFields"
            >


                <!-- ==================================================
                     PARTICIPANTES
                ================================================== -->

                <div class="form-section">


                    <label>
                        Participantes
                    </label>


                    <div
                        class="participants-container"
                        id="participantsContainer"
                    >


                        <div class="participant-row">


                            <select class="participant-select">

                                <option value="">
                                    Selecione o participante
                                </option>

                                <option value="Aluno A">Aluno A</option>
                                <option value="Aluno B">Aluno B</option>
                                <option value="Aluno C">Aluno C</option>
                                <option value="Aluno D">Aluno D</option>
                                <option value="Aluno E">Aluno E</option>
                                <option value="Aluno F">Aluno F</option>
                                <option value="Aluno G">Aluno G</option>
                                <option value="Aluno H">Aluno H</option>
                                <option value="Aluno I">Aluno I</option>
                                <option value="Aluno J">Aluno J</option>
                                <option value="Aluno K">Aluno K</option>
                                <option value="Aluno L">Aluno L</option>
                                <option value="Aluno M">Aluno M</option>
                                <option value="Aluno N">Aluno N</option>
                                <option value="Aluno O">Aluno O</option>
                                <option value="Aluno P">Aluno P</option>
                                <option value="Aluno Q">Aluno Q</option>
                                <option value="Aluno R">Aluno R</option>
                                <option value="Aluno S">Aluno S</option>
                                <option value="Aluno T">Aluno T</option>
                                <option value="Aluno U">Aluno U</option>
                                <option value="Aluno V">Aluno V</option>
                                <option value="Aluno W">Aluno W</option>
                                <option value="Aluno X">Aluno X</option>
                                <option value="Aluno Y">Aluno Y</option>
                                <option value="Aluno Z">Aluno Z</option>

                            </select>


                        </div>


                    </div>


                    <button
                        type="button"
                        class="add-participant-button"
                        id="addParticipantButton"
                    >
                        + Adicionar participante
                    </button>


                </div>



                <!-- ==================================================
                     TEXTO
                ================================================== -->

                <div
                    class="form-section"
                    id="textField"
                >

                    <label
                        for="textContent"
                    >

            document.querySelectorAll(

            );


        const participantes = [];


        selects.forEach(select => {

            const valor =
                select.value.trim();


            if (
                valor &&
                !participantes.includes(valor)
            ) {

                participantes.push(
                    valor
                );

            }

        });


        return participantes;

    }

    async function publicarTrabalho() {

        if (!selectedType) {

            alert(
                "Escolha o tipo de trabalho."
            );

            return;

        }


        const participantes =
            obterParticipantes();


        if (
            participantes.length === 0
        ) {

            alert(
                "Selecione pelo menos um participante."
            );

            return;

        }


        let conteudo = "";


        /* ==================================================
           TEXTO
        ================================================== */

        if (
            selectedType === "texto"
        ) {

            conteudo =
                textContent.value.trim();


            if (!conteudo) {

                alert(
                    "Digite o conteúdo do trabalho."
                );

                return;

            }

        }



        /* ==================================================
           VÍDEO
        ================================================== */

        if (
            selectedType === "video"
        ) {

            conteudo =
                videoUrl.value.trim();


            if (!conteudo) {

                alert(
                    "Digite a URL do vídeo."
                );

                return;

            }


            if (
                !conteudo.includes(
                    "youtube.com"
                ) &&
                !conteudo.includes(
                    "youtu.be"
                )
            ) {

                alert(
                    "Digite uma URL válida do YouTube."
                );

                return;

            }

        }



        publishButton.disabled =
            true;


        publishButton.textContent =
            "Publicando...";


        try {


            /* ==================================================
               IMAGEM
            ================================================== */

            if (
                selectedType === "imagem"
            ) {

                const file =
                    imageFile.files[0];


                if (!file) {

                    alert(
                        "Selecione uma imagem."
                    );

                    return;

                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    alert(
                        "O arquivo selecionado não é uma imagem."
                    );

                    return;

                }


                const extensao =
                    file.name
                        .split(".")
                        .pop();


                const nomeArquivo =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2) +
                    "." +
                    extensao;


                const caminho =
                    nomeArquivo;


                const {
                    error: uploadError
                } = await supabaseClient
                    .storage
                    .from("imagens")
                    .upload(
                        caminho,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false
                        }
                    );


                if (uploadError) {

                    console.error(
                        uploadError
                    );


                    alert(
                        "Não foi possível enviar a imagem.\n\n" +
                        uploadError.message
                    );

                    return;

                }


                const {
                    data: publicData
                } =
                    supabaseClient
                        .storage
                        .from("imagens")
                        .getPublicUrl(
                            caminho
                        );


                conteudo =
                    publicData.publicUrl;

            }



            /* ==================================================
               INSERIR NO BANCO
            ================================================== */

            const nomePrincipal =
                participantes[0];


            const {
                error
            } =
                await supabaseClient
                    .from("trabalhos")
                    .insert({

                        nome:
                            participantes.join(
                                ", "
                            ),

                        nomes:
                            participantes,

                        tipo:
                            selectedType,

                        conteudo:
                            conteudo,

                        aprovado:
                            false,

                        data_criacao:
                            new Date()
                                .toISOString()

                    });


            if (error) {

                console.error(
                    error
                );


                alert(
                    "Não foi possível publicar o trabalho.\n\n" +
                    error.message
                );


                return;

            }


            alert(
                "Trabalho enviado para aprovação!"
            );


            limparFormulario();


            await carregarTrabalhos();

        }


        catch (error) {

            console.error(
                error
            );


            alert(
                "Ocorreu um erro ao publicar o trabalho."
            );

        }


        finally {

            publishButton.disabled =
                false;

            publishButton.textContent =
                "Publicar Trabalho";

        }

    }

    async function carregarTrabalhos() {

        try {

                supabaseClient
                    .from("trabalhos")
                    .select("*");


            if (!isAdmin) {

                query =
                    query.eq(
                        "aprovado",
                        true
                    );

            }


            query =
                query.order(
                    "data_criacao",
                    {
                        ascending:
                            false
                    }
                );


            const {
                data,
                error
            } =
                await query;


            if (error) {

                console.error(
                    error
                );

                return;

            }


            atualizarFiltroPessoas(
                data || []
            );


            aplicarFiltros(
                data || []
            );

        }


        catch (error) {

            console.error(
                error
            );

        }

    }



    /* ==================================================

    function obterNomesDoTrabalho(
        trabalho
    ) {

        if (
            Array.isArray(
                trabalho.nomes
            ) &&
            trabalho.nomes.length > 0
        ) {

            return trabalho.nomes;

        }


        if (
            trabalho.nome
        ) {

            return trabalho.nome
                .split(",")
                .map(
                    nome =>
                        nome.trim()
                )
                .filter(Boolean);

        }


        return [];

    }



    /* ==================================================
       ATUALIZAR LISTA DE PESSOAS
    ================================================== */

    function atualizarFiltroPessoas(
        trabalhos

        peopleFilterList.innerHTML =
            "";


        const pessoas =
            new Set();


        alunos.forEach(aluno => {

            pessoas.add(
                aluno
            );

        });


        trabalhos.forEach(trabalho => {

            obterNomesDoTrabalho(
                trabalho
            ).forEach(nome => {

                pessoas.add(
                    nome
                );

            });

        });


        Array.from(pessoas)
            .sort(
                (a,b) =>
                    a.localeCompare(b)
            )
            .forEach(nome => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "subfilter-button";


                button.textContent =
                    nome;


                button.dataset.person =
                    nome;


                if (
                    currentPerson ===
                    nome &&
                    currentFilter ===
                    "pessoa"
                ) {

                    button.classList.add(
                        "active"
                    );

                }


                button.addEventListener(
                    "click",
                    () => {

                        currentFilter =

                        currentPerson =
                            nome;

                        currentType =
                            null;


                        document
                            .querySelectorAll(
                                "[data-person]"
                            )
                            .forEach(item => {

                                item.classList.remove(
                                    "active"
                                );

                            });


                        button.classList.add(
                            "active"
                        );


                        aplicarFiltros(
                            trabalhos

                    }
                );


                peopleFilterList.appendChild(
                    button

                    currentType =
                        null;


                    tempoOptions.classList.add(
                        "visible"
                    );

                }


                if (
                    filtro === "pessoa"
                ) {

                    currentFilter =
                        "pessoa";

                    currentPerson =
                        null;

                    currentType =
                        null;


                    pessoaOptions.classList.add(
                        "visible"
                    );

                }


                if (
                    filtro === "tipo"
                ) {

                    currentFilter =
                        "tipo";

                    currentPerson =
                        null;

                    currentType =
                        null;


                    tipoOptions.classList.add(
                        "visible"
                    );

                }


                await carregarTrabalhos();

            }
        );

    });



    /* ==================================================
       FILTRO POR TIPO
    ================================================== */

    document
        .querySelectorAll(
            "[data-type-filter]"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    currentFilter =
                        "tipo";


                    currentType =
                        button.dataset
                            .typeFilter;


                    currentPerson =
                        null;


                    document
                        .querySelectorAll(
                            "[data-type-filter]"
                        )
                        .forEach(item => {

                            item.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add(
                        "active"
                    );


                    await carregarTrabalhos();

                }
            );

        });



    /* ==================================================
       APLICAR FILTROS
    ================================================== */

    function aplicarFiltros(
        trabalhos
    ) {

        let resultado =
            [...trabalhos];


        /* ==================================================
           POR TEMPO
        ================================================== */

        if (
            currentFilter ===
            "tempo"
        ) {

            resultado.sort(
                (a,b) => {

                    return (
                        new Date(
                            b.data_criacao ||
                            0
                        ) -
                        new Date(
                            a.data_criacao ||
                            0
                        )
                    );

                }
            );

        }



        /* ==================================================
           POR PESSOA
        ================================================== */

        if (
            currentFilter ===
            "pessoa" &&
            currentPerson
        ) {

            resultado =
                resultado.filter(
                    trabalho => {

                        const nomes =
                            obterNomesDoTrabalho(
                                trabalho
                            );


                        return nomes.includes(
                            currentPerson
                        );

                    }
                );

        }



        /* ==================================================
           POR TIPO
        ================================================== */

        if (
            currentFilter ===
            "tipo" &&
            currentType
        ) {

            resultado =
                resultado.filter(
                    trabalho =>
                        trabalho.tipo ===
                        currentType
                );

        }


        renderizarTrabalhos(
            resultado
        );

    }



    /* ==================================================
       RENDERIZAR
    ================================================== */

    function renderizarTrabalhos(
        trabalhos
    ) {

        worksArea.innerHTML =
            "";


        if (
            !trabalhos ||
            trabalhos.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty-state";


            const h =
                document.createElement(
                    "h1"
                );


            h.textContent =
                "Nenhum trabalho encontrado";


            const p =
                document.createElement(
                    "p"
                );


            if (
                isAdmin
            ) {

                p.textContent =
                    "Não existem trabalhos correspondentes ao filtro.";

            }

            else {

                p.textContent =
                    "Não existem trabalhos correspondentes ao filtro.";

            }


            empty.appendChild(
                h
            );


            empty.appendChild(
                p
            );


            worksArea.appendChild(
                empty
            );


            return;

        }



        trabalhos.forEach(
            trabalho => {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "work-card";



                /* ==================================================
                   CABEÇALHO
                ================================================== */

                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "work-header";


                const info =
                    document.createElement(
                        "div"
                    );


                const author =
                    document.createElement(
                        "div"
                    );


                author.className =
                    "work-author";


                const nomes =
                    obterNomesDoTrabalho(
                        trabalho
                    );


                author.textContent =
                    nomes.length === 1
                        ? nomes[0]
                        : nomes.length > 1
                            ? `${nomes.length} participantes`
                            : trabalho.nome || "Sem nome";


                info.appendChild(
                    author
                );



                /* ==================================================
                   PARTICIPANTES
                ================================================== */

                if (
                    nomes.length > 1
                ) {

                    const badges =
                        document.createElement(
                            "div"
                        );


                    badges.className =
                        "work-participants";


                    nomes.forEach(nome => {

                        const badge =
                            document.createElement(
                                "span"
                            );


                        badge.className =
                            "participant-badge";


                        badge.textContent =
                            nome;


                        badges.appendChild(
                            badge
                        );

                    });


                    info.appendChild(
                        badges
                    );

                }



                /* ==================================================
                   DATA
                ================================================== */

                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "work-date";


                if (
                    trabalho.data_criacao
                ) {

                    const data =
                        new Date(
                            trabalho.data_criacao
                        );


                    date.textContent =
                        data.toLocaleString(
                            "pt-BR",
                            {
                                dateStyle:
                                    "short",
                                timeStyle:
                                    "short"
                            }
                        );

                }

                else {

                    date.textContent =
                        "ID do trabalho: #" +
                        trabalho.id;

                }


                info.appendChild(
                    date
                );



                /* ==================================================
                   TIPO
                ================================================== */

                const type =
                    document.createElement(
                        "div"
                    );


                type.className =
                    "work-type";


                if (
                    trabalho.tipo ===
                    "texto"
                ) {

                    type.textContent =
                        "📝 Texto";

                }


                else if (
                    trabalho.tipo ===
                    "imagem"
                ) {

                    type.textContent =
                        "🖼️ Imagem";

                }


                else {

                    type.textContent =
                        "▶️ Vídeo";

                }


                header.appendChild(
                    info
                );


                header.appendChild(
                    type
                );


                card.appendChild(
                    header
                );



                /* ==================================================
                   STATUS ADMIN
                ================================================== */

                if (
                    isAdmin &&
                    !trabalho.aprovado
                ) {

                    const status =
                        document.createElement(
                            "div"
                        );


                    status.className =
                        "pending-badge";


                    status.textContent =
                        "⏳ Aguardando aprovação";


                    card.appendChild(
                        status
                    );

                }



                /* ==================================================
                   TEXTO
                ================================================== */

                if (
                    trabalho.tipo ===
                    "texto"
                ) {

                    const texto =
                        document.createElement(
                            "div"
                        );


                    texto.className =
                        "work-text";


                    texto.textContent =
                        trabalho.conteudo;


                    card.appendChild(
                        texto
                    );

                }



                /* ==================================================
                   IMAGEM
                ================================================== */

                if (
                    trabalho.tipo ===
                    "imagem"
                ) {

                    const imagem =
                        document.createElement(
                            "img"
                        );


                    imagem.className =
                        "work-image";


                    imagem.src =
                        trabalho.conteudo;


                    imagem.alt =
                        "Imagem do trabalho";


                    imagem.loading =
                        "lazy";


                    card.appendChild(
                        imagem
                    );

                }



                /* ==================================================
                   VÍDEO
                ================================================== */

                if (
                    trabalho.tipo ===
                    "video"
                ) {

                    const iframe =
                        document.createElement(
                            "iframe"
                        );


                    iframe.className =
                        "work-video";


                    iframe.src =
                        transformarYoutubeUrl(
                            trabalho.conteudo
                        );


                    iframe.title =
                        "Vídeo do trabalho";


                    iframe.allow =
                        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";


                    iframe.allowFullscreen =
                        true;


                    card.appendChild(
                        iframe
                    );

                }



                /* ==================================================
                   CONTROLES ADMIN
                ================================================== */

                if (
                    isAdmin
                ) {

                    criarControlesAdmin(
                        card,
                        trabalho
                    );

                }


                worksArea.appendChild(
                    card
                );

            }
        );

    }



    /* ==================================================
       CONTROLES ADMIN
    ================================================== */

    function criarControlesAdmin(
        card,
        trabalho
    ) {

        const controls =
            document.createElement(
                "div"
            );


        controls.className =
            "admin-controls";



        /* ==================================================
           APROVAR
        ================================================== */

        if (
            !trabalho.aprovado
        ) {

            const approveButton =
                document.createElement(
                    "button"
                );


            approveButton.className =
                "approve-button";


            approveButton.textContent =
                "Aprovar";


            approveButton.addEventListener(
                "click",
                async () => {

                    await aprovarTrabalho(
                        trabalho.id
                    );

                }
            );


            controls.appendChild(
                approveButton
            );

        }



        /* ==================================================
           EDITAR
        ================================================== */

        const editButton =
            document.createElement(
                "button"
            );


        editButton.className =
            "edit-button";


        editButton.textContent =
            "Editar";


        editButton.addEventListener(
            "click",
            async () => {

                await editarTrabalho(
                    trabalho
                );

            }
        );


        controls.appendChild(
            editButton
        );



        /* ==================================================
           APAGAR
        ================================================== */

        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.className =
            "delete-button";


        deleteButton.textContent =
            "Apagar";


        deleteButton.addEventListener(
            "click",
            async () => {

                await apagarTrabalho(
                    trabalho
                );

            }
        );


        controls.appendChild(
            deleteButton
        );


        card.appendChild(
            controls
        );

    }



    /* ==================================================
       APROVAR
    ================================================== */

    async function aprovarTrabalho(
        id
    ) {

        if (
            !confirm(
                "Deseja aprovar este trabalho?"
            )
        ) {

            return;

        }


        const {
            error
        } =
            await supabaseClient
                .from("trabalhos")
                .update({

                    aprovado:
                        true

                })
                .eq(
                    "id",
                    id
                );


        if (error) {

            console.error(
                error
            );


            alert(
                "Não foi possível aprovar o trabalho."
            );


            return;

        }


        await carregarTrabalhos();

    }



    /* ==================================================
       EDITAR
    ================================================== */

    async function editarTrabalho(
        trabalho
    ) {

        const novoConteudo =
            prompt(
                trabalho.tipo === "video"
                    ? "URL do vídeo:"
                    : trabalho.tipo === "imagem"
                        ? "URL da imagem:"
                        : "Conteúdo do trabalho:",
                trabalho.conteudo
            );


        if (
            novoConteudo === null
        ) {

            return;

        }


        if (
            !novoConteudo.trim()
        ) {

            alert(
                "O conteúdo não pode ficar vazio."
            );

            return;

        }


        const {
            error
        } =
            await supabaseClient
                .from("trabalhos")
                .update({

                    conteudo:
                        novoConteudo.trim()

                })
                .eq(
                    "id",
                    trabalho.id
                );


        if (error) {

            console.error(
                error
            );


            alert(
                "Não foi possível editar o trabalho."
            );


            return;

        }


        alert(
            "Trabalho editado com sucesso!"
        );


        await carregarTrabalhos();

    }



    /* ==================================================
       APAGAR
    ================================================== */

    async function apagarTrabalho(
        trabalho
    ) {

        if (
            !confirm(
                "Tem certeza que deseja apagar este trabalho?\n\nEssa ação não pode ser desfeita."
            )
        ) {

            return;

        }


        const {
            error
        } =
            await supabaseClient
                .from("trabalhos")
                .delete()
                .eq(
                    "id",
                    trabalho.id
                );


        if (error) {

            console.error(
                error
            );


            alert(
                "Não foi possível apagar o trabalho."
            );


            return;

        }


        /* ==================================================
           APAGAR IMAGEM DO STORAGE
        ================================================== */

        if (
            trabalho.tipo ===
            "imagem"
        ) {

            try {

                const url =
                    trabalho.conteudo;


                const partes =
                    url.split(
                        "/imagens/"
                    );


                if (
                    partes.length > 1
                ) {

                    const caminho =
                        decodeURIComponent(
                            partes[1]
                        );


                    await supabaseClient
                        .storage
                        .from("imagens")
                        .remove([
                            caminho
                        ]);

                }

            }

            catch (error) {

                console.warn(
                    "Não foi possível remover a imagem do Storage:",
                    error
                );

            }

        }


        await carregarTrabalhos();

    }



    /* ==================================================
       YOUTUBE
    ================================================== */

    function transformarYoutubeUrl(
        url
    ) {

        try {

            const endereco =
                new URL(url);


            let id = "";


            if (
                endereco.hostname.includes(
                    "youtu.be"
                )
            ) {

                id =
                    endereco.pathname.substring(
                        1
                    );

            }


            if (
                endereco.hostname.includes(
                    "youtube.com"
                )
            ) {

                id =
                    endereco.searchParams.get(
                        "v"
                    );


                if (
                    !id &&
                    endereco.pathname.startsWith(
                        "/shorts/"
                    )
                ) {

                    id =
                        endereco.pathname
                            .split("/")
                            [2];

                }


                if (
                    !id &&
                    endereco.pathname.startsWith(
                        "/embed/"
                    )
                ) {

                    id =
                        endereco.pathname
                            .split("/")
                            [2];

                }

            }


            if (!id) {

                return url;

            }


            return (
                "https://www.youtube.com/embed/" +
                id
            );

        }

        catch {

            return url;

        }

    }



    /* ==================================================
       INICIAR
    ================================================== */

    async function iniciarSistema() {

        await verificarSessao();

        await carregarTrabalhos();

    }


    iniciarSistema();

</script>
