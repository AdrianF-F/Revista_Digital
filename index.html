<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trabalhos Escolares</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         TOPO
    ================================================== -->

    <header class="topbar">

        <!-- LOGO DA ESCOLA -->

        <div class="school-logo">

            <img
                src="logo da escola.png"
                alt="Logo da escola"
            >

        </div>


        <!-- ADMINISTRADOR -->

        <button
            class="admin-button"
            id="adminButton"
        >
            Entrar como administrador
        </button>

    </header>



    <!-- ==================================================
         ESTRUTURA PRINCIPAL
    ================================================== -->

    <main class="layout">


        <!-- ==================================================
             MENU ESQUERDO
        ================================================== -->

        <aside class="left-sidebar">


            <nav class="main-navigation">


                <button
                    class="nav-button active"
                    id="homeButton"
                >
                    Início
                </button>


                <button
                    class="nav-button"
                    id="statisticsButton"
                >
                    Estatísticas
                </button>


                <button
                    class="nav-button"
                    id="instructionsButton"
                >
                    Instruções
                </button>


            </nav>


        </aside>



        <!-- ==================================================
             CONTEÚDO CENTRAL
        ================================================== -->

        <section class="main-content">


            <!-- ==================================================
                 ADICIONAR TRABALHO
            ================================================== -->

            <button
                class="add-work-button"
                id="addWorkButton"
            >
                + Adicionar Trabalho
            </button>



            <!-- ==================================================
                 FORMULÁRIO
            ================================================== -->

            <div
                class="work-form"
                id="workForm"
            >


                <h2>
                    Adicionar Trabalho
                </h2>



                <!-- ==================================================
                     TIPO
                ================================================== -->

                <div class="form-section">

                    <label>
                        Tipo de trabalho
                    </label>


                    <div class="type-buttons">


                        <button
                            type="button"
                            class="type-button"
                            data-type="texto"
                        >
                            📝 Texto
                        </button>


                        <button
                            type="button"
                            class="type-button"
                            data-type="video"
                        >
                            ▶️ Vídeo
                        </button>


                    </div>

                </div>



                <!-- ==================================================
                     CAMPOS
                ================================================== -->

                <div
                    class="work-fields"
                    id="workFields"
                >


                    <!-- ==================================================
                         NOME
                    ================================================== -->

                    <div class="form-section">

                        <label
                            for="studentName"
                        >
                            Seu nome
                        </label>


                        <select
                            id="studentName"
                        >

                            <option value="">
                                Selecione seu nome
                            </option>

                            <option value="Aluno A">
                                Aluno A
                            </option>

                            <option value="Aluno B">
                                Aluno B
                            </option>

                            <option value="Aluno C">
                                Aluno C
                            </option>

                            <option value="Aluno D">
                                Aluno D
                            </option>

                            <option value="Aluno E">
                                Aluno E
                            </option>

                            <option value="Aluno F">
                                Aluno F
                            </option>

                            <option value="Aluno G">
                                Aluno G
                            </option>

                            <option value="Aluno H">
                                Aluno H
                            </option>

                            <option value="Aluno I">
                                Aluno I
                            </option>

                            <option value="Aluno J">
                                Aluno J
                            </option>

                            <option value="Aluno K">
                                Aluno K
                            </option>

                            <option value="Aluno L">
                                Aluno L
                            </option>

                            <option value="Aluno M">
                                Aluno M
                            </option>

                            <option value="Aluno N">
                                Aluno N
                            </option>

                            <option value="Aluno O">
                                Aluno O
                            </option>

                            <option value="Aluno P">
                                Aluno P
                            </option>

                            <option value="Aluno Q">
                                Aluno Q
                            </option>

                            <option value="Aluno R">
                                Aluno R
                            </option>

                            <option value="Aluno S">
                                Aluno S
                            </option>

                            <option value="Aluno T">
                                Aluno T
                            </option>

                            <option value="Aluno U">
                                Aluno U
                            </option>

                            <option value="Aluno V">
                                Aluno V
                            </option>

                            <option value="Aluno W">
                                Aluno W
                            </option>

                            <option value="Aluno X">
                                Aluno X
                            </option>

                            <option value="Aluno Y">
                                Aluno Y
                            </option>

                            <option value="Aluno Z">
                                Aluno Z
                            </option>

                        </select>

                    </div>



                    <!-- ==================================================
                         TEXTO
                    ================================================== -->

                    <div
                        class="form-section"
                        id="textField"
                    >

                        <label
                            for="textContent"
                        >
                            Trabalho
                        </label>


                        <textarea
                            id="textContent"
                            placeholder="Digite o seu trabalho..."
                        ></textarea>

                    </div>



                    <!-- ==================================================
                         VÍDEO
                    ================================================== -->

                    <div
                        class="form-section"
                        id="videoField"
                    >

                        <label
                            for="videoUrl"
                        >
                            URL do vídeo do YouTube
                        </label>


                        <input
                            type="url"
                            id="videoUrl"
                            placeholder="https://www.youtube.com/watch?v=..."
                        >

                    </div>



                    <!-- ==================================================
                         PUBLICAR
                    ================================================== -->

                    <button
                        type="button"
                        class="publish-button"
                        id="publishButton"
                    >
                        Publicar Trabalho
                    </button>


                </div>


            </div>



            <!-- ==================================================
                 TRABALHOS
            ================================================== -->

            <section
                class="works-section"
                id="worksArea"
            >


                <div class="empty-state">

                    <h1>
                        Trabalhos postados
                    </h1>

                    <p>
                        Os trabalhos aprovados aparecerão aqui.
                    </p>

                </div>


            </section>


        </section>



        <!-- ==================================================
             MENU DIREITO
        ================================================== -->

        <aside class="right-sidebar">


            <div class="filter-title">

                Organizar trabalhos

            </div>


            <button
                class="filter-button active"
                data-filter="tempo"
            >
                Por tempo
            </button>


            <button
                class="filter-button"
                data-filter="pessoa"
            >
                Por pessoa
            </button>


            <button
                class="filter-button"
                data-filter="tipo"
            >
                Por tipo de trabalho
            </button>


        </aside>


    </main>



    <!-- ==================================================
         MODAL DE LOGIN DO ADMINISTRADOR
    ================================================== -->

    <div
        class="admin-modal"
        id="adminModal"
    >


        <div class="admin-modal-box">


            <h2>
                Login do administrador
            </h2>


            <p class="admin-login-description">
                Entre com a conta de administrador.
            </p>



            <!-- E-MAIL -->

            <label
                for="adminEmail"
            >
                E-mail
            </label>


            <input
                type="email"
                id="adminEmail"
                placeholder="E-mail"
                autocomplete="username"
            >



            <!-- SENHA -->

            <label
                for="adminPassword"
            >
                Senha
            </label>


            <input
                type="password"
                id="adminPassword"
                placeholder="Senha"
                autocomplete="current-password"
            >



            <!-- BOTÕES -->

            <div class="admin-modal-buttons">


                <button
                    type="button"
                    id="cancelAdminLogin"
                >
                    Cancelar
                </button>


                <button
                    type="button"
                    id="confirmAdminLogin"
                >
                    Entrar
                </button>


            </div>


        </div>


    </div>



    <!-- ==================================================
         SUPABASE
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ==================================================
         JAVASCRIPT DO SITE
    ================================================== -->

    <script
        src="script.js"
    ></script>


</body>

</html>
