<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trabalhos Escolares</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TOPO
    ========================== -->

    <header class="topbar">

        <div class="school-logo">
            <img src="Logo da escola.png" alt="Logo da escola">
        </div>

        <button class="admin-button" id="adminButton">
            Entrar como administrador
        </button>

    </header>


    <!-- =========================
         ESTRUTURA PRINCIPAL
    ========================== -->

    <div class="page-layout">


        <!-- =========================
             MENU ESQUERDO
        ========================== -->

        <aside class="left-sidebar">

            <nav class="main-nav">

                <button class="nav-button active">
                    Início
                </button>

                <button class="nav-button">
                    Estatísticas
                </button>

                <button class="nav-button">
                    Instruções
                </button>

            </nav>

        </aside>



        <!-- =========================
             CONTEÚDO CENTRAL
        ========================== -->

        <main class="content">


            <!-- =========================
                 ADICIONAR TRABALHO
            ========================== -->

            <section class="add-work-area">

                <button
                    class="add-work-button"
                    id="addWorkButton">

                    <span class="plus">+</span>

                    Adicionar Trabalho

                </button>


                <!-- FORMULÁRIO -->

                <div
                    class="work-form"
                    id="workForm">


                    <h2>
                        Adicionar Trabalho
                    </h2>


                    <!-- TIPO DO TRABALHO -->

                    <div class="form-section">

                        <label>
                            Tipo de trabalho
                        </label>


                        <div class="type-buttons">

                            <button
                                class="type-button"
                                data-type="texto">

                                📝 Texto

                            </button>


                            <button
                                class="type-button"
                                data-type="video">

                                ▶️ Vídeo

                            </button>

                        </div>

                    </div>



                    <!-- CAMPOS DO TRABALHO -->

                    <div
                        class="work-fields"
                        id="workFields">


                        <!-- NOME -->

                        <div class="form-section">

                            <label for="studentName">
                                Seu nome
                            </label>


                            <select id="studentName">

                                <option value="">
                                    Selecione seu nome
                                </option>

                                <option>Aluno A</option>
                                <option>Aluno B</option>
                                <option>Aluno C</option>
                                <option>Aluno D</option>
                                <option>Aluno E</option>
                                <option>Aluno F</option>
                                <option>Aluno G</option>
                                <option>Aluno H</option>
                                <option>Aluno I</option>
                                <option>Aluno J</option>
                                <option>Aluno K</option>
                                <option>Aluno L</option>
                                <option>Aluno M</option>
                                <option>Aluno N</option>
                                <option>Aluno O</option>
                                <option>Aluno P</option>
                                <option>Aluno Q</option>
                                <option>Aluno R</option>
                                <option>Aluno S</option>
                                <option>Aluno T</option>
                                <option>Aluno U</option>
                                <option>Aluno V</option>
                                <option>Aluno W</option>
                                <option>Aluno X</option>
                                <option>Aluno Y</option>
                                <option>Aluno Z</option>

                            </select>

                        </div>



                        <!-- TEXTO -->

                        <div
                            class="form-section"
                            id="textField">

                            <label for="textContent">
                                Trabalho
                            </label>


                            <textarea
                                id="textContent"
                                placeholder="Digite seu trabalho aqui..."></textarea>

                        </div>



                        <!-- VÍDEO -->

                        <div
                            class="form-section"
                            id="videoField">

                            <label for="videoUrl">
                                URL do vídeo no YouTube
                            </label>


                            <input
                                type="url"
                                id="videoUrl"
                                placeholder="https://www.youtube.com/watch?v=...">

                        </div>



                        <!-- PUBLICAR -->

                        <button
                            class="publish-button"
                            id="publishButton">

                            Publicar Trabalho

                        </button>

                    </div>

                </div>

            </section>



            <!-- =========================
                 FEED DE TRABALHOS
            ========================== -->

            <section
                class="works-area"
                id="worksArea">


                <div
                    class="empty-state"
                    id="emptyState">

                    <h1>
                        Trabalhos postados
                    </h1>

                    <p>
                        Os trabalhos aparecerão aqui.
                    </p>

                </div>


            </section>

        </main>



        <!-- =========================
             MENU DIREITO
        ========================== -->

        <aside class="right-sidebar">


            <div class="organize-title">
                Organizar trabalhos
            </div>


            <nav class="organize-nav">

                <button
                    class="filter-button active"
                    data-filter="time">

                    Por tempo

                </button>


                <button
                    class="filter-button"
                    data-filter="person">

                    Por pessoa

                </button>


                <button
                    class="filter-button"
                    data-filter="type">

                    Por tipo de trabalho

                </button>

            </nav>

        </aside>

    </div>
<!-- MODAL DE LOGIN DO ADMINISTRADOR -->
<div class="admin-modal" id="adminModal">

    <div class="admin-modal-box">

        <h2>Login do administrador</h2>

        <input
            type="email"
            id="adminEmail"
            placeholder="E-mail do administrador"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Senha"
        >

        <div class="admin-modal-buttons">

            <button id="cancelAdminLogin">
                Cancelar
            </button>

            <button id="confirmAdminLogin">
                Entrar
            </button>

        </div>

    </div>

</div>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- JAVASCRIPT DO SITE -->

    <script src="script.js"></script>

</body>

</html>
