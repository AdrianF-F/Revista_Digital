<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trabalhos Escolares</title>


    <style>

        /* ==================================================
           VARIÁVEIS
        ================================================== */

        :root {

            --blue: #0878d1;
            --blue-light: #6aa8ff;
            --green: #00a889;
            --green-dark: #007d70;
            --background: #202526;
            --background-dark: #111313;
            --card: #111111;
            --card-light: #181919;
            --border: #343a3b;
            --text: #d4e0eb;
            --text-muted: #8996a2;
            --danger: #b53a3a;
            --warning: #f0b429;

        }


        /* ==================================================
           RESET
        ================================================== */

        * {

            box-sizing: border-box;
            margin: 0;
            padding: 0;

        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(8, 120, 209, 0.08),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* ==================================================
           TOPO
        ================================================== */

        .topbar {

            width: 100%;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 5%;

            background:
                linear-gradient(
                    110deg,
                    #0878d1,
                    #0796ad,
                    #00a889
                );

            border-bottom: 1px solid
                rgba(255,255,255,.08);

        }


        /* ==================================================
           LOGO
        ================================================== */

        .school-logo {

            height: 82px;

            display: flex;
            align-items: center;

        }


        .school-logo img {

            height: 78px;
            width: auto;
            max-width: 250px;

            object-fit: contain;

        }


        /* ==================================================
           BOTÃO ADMIN
        ================================================== */

        .admin-button {

            border: none;
            border-radius: 30px;

            padding: 15px 26px;

            background: #101313;

            color: #00c59e;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform .2s,
                background .2s,
                color .2s;

        }


        .admin-button:hover {

            transform: translateY(-2px);

            background: #080909;

            color: #5ee6c4;

        }


        /* ==================================================
           LAYOUT PRINCIPAL
        ================================================== */

        .layout {

            width: 100%;
            max-width: 1500px;

            margin: 0 auto;

            padding: 30px;

            display: grid;

            grid-template-columns:
                190px
                minmax(0, 1fr)
                190px;

            gap: 25px;

        }


        /* ==================================================
           MENU ESQUERDO
        ================================================== */

        .left-sidebar {

            padding-top: 10px;

        }


        .main-navigation {

            display: flex;
            flex-direction: column;

            gap: 12px;

        }


        .nav-button {

            width: 100%;

            padding: 16px 12px;

            border: none;
            border-radius: 12px;

            background: transparent;

            color: #aebdca;

            font-size: 16px;
            font-weight: bold;

            text-align: left;

            cursor: pointer;

            transition:
                background .2s,
                color .2s,
                transform .2s;

        }


        .nav-button:hover {

            background:
                rgba(0, 168, 137, .12);

            color: white;

        }


        .nav-button.active {

            background:
                rgba(0, 168, 137, .20);

            color: #52d5b8;

        }


        /* ==================================================
           CONTEÚDO CENTRAL
        ================================================== */

        .main-content {

            min-width: 0;

        }


        /* ==================================================
           BOTÃO ADICIONAR
        ================================================== */

        .add-work-button {

            width: 100%;

            border: none;
            border-radius: 14px;

            padding: 18px;

            background:
                linear-gradient(
                    100deg,
                    var(--blue),
                    var(--green)
                );

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(0, 130, 170, .15);

            transition:
                transform .2s,
                filter .2s;

        }


        .add-work-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.08);

        }


        /* ==================================================
           FORMULÁRIO
        ================================================== */

        .work-form {

            display: none;

            margin-top: 18px;

            padding: 25px;

            background: var(--card);

            border: 1px solid
                var(--border);

            border-radius: 18px;

        }


        .work-form.visible {

            display: block;

        }


        .work-form h2 {

            margin-bottom: 22px;

            color: var(--blue-light);

            font-size: 24px;

        }


        /* ==================================================
           SEÇÕES
        ================================================== */

        .form-section {

            margin-bottom: 20px;

        }


        .form-section label {

            display: block;

            margin-bottom: 8px;

            color: #b8c8d7;

            font-size: 14px;
            font-weight: bold;

        }


        /* ==================================================
           BOTÕES DE TIPO
        ================================================== */

        .type-buttons {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 12px;

        }


        .type-button {

            border: 1px solid
                var(--border);

            border-radius: 10px;

            padding: 15px;

            background: var(--card-light);

            color: #b7c6d4;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                border .2s,
                background .2s,
                color .2s;

        }


        .type-button:hover {

            border-color:
                var(--green);

        }


        .type-button.selected {

            background:
                rgba(0, 168, 137, .18);

            border-color:
                #00c7a5;

            color: #4edabd;

        }


        /* ==================================================
           CAMPOS
        ================================================== */

        .work-fields {

            display: none;

        }


        .work-fields.visible {

            display: block;

        }


        #textField,
        #videoField {

            display: none;

        }


        #textField.visible,
        #videoField.visible {

            display: block;

        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid
                var(--border);

            border-radius: 9px;

            background:
                #181919;

            color: white;

            outline: none;

            font-family: inherit;

            font-size: 15px;

            transition:
                border .2s,
                box-shadow .2s;

        }


        input,
        select {

            height: 46px;

            padding: 0 13px;

        }


        textarea {

            min-height: 180px;

            padding: 13px;

            resize: vertical;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                var(--blue);

            box-shadow:
                0 0 0 2px
                rgba(8, 120, 209, .15);

        }


        select {

            cursor: pointer;

        }


        select option {

            background: #181919;

            color: white;

        }


        /* ==================================================
           BOTÃO PUBLICAR
        ================================================== */

        .publish-button {

            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 14px;

            background:
                linear-gradient(
                    100deg,
                    #0878d1,
                    #00a889
                );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                filter .2s,
                transform .2s;

        }


        .publish-button:hover {

            filter: brightness(1.08);

            transform: translateY(-1px);

        }


        .publish-button:disabled {

            opacity: .6;

            cursor: wait;

            transform: none;

        }


        /* ==================================================
           ÁREA DOS TRABALHOS
        ================================================== */

        .works-section {

            margin-top: 25px;

            display: flex;
            flex-direction: column;

            gap: 18px;

        }


        /* ==================================================
           CARD
        ================================================== */

        .work-card {

            background:
                var(--card);

            border: 1px solid
                rgba(255,255,255,.05);

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.12);

        }


        /* ==================================================
           CABEÇALHO
        ================================================== */

        .work-header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;

        }


        .work-author {

            color: #dbe8f4;

            font-size: 20px;
            font-weight: bold;

        }


        .work-date {

            margin-top: 5px;

            color:
                var(--text-muted);

            font-size: 13px;

        }


        .work-type {

            padding: 8px 12px;

            border-radius: 20px;

            background:
                rgba(8,120,209,.15);

            color:
                #78baff;

            font-size: 13px;
            font-weight: bold;

        }


        /* ==================================================
           TEXTO
        ================================================== */

        .work-text {

            color: #c2d0dc;

            font-size: 17px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;

        }


        /* ==================================================
           VÍDEO
        ================================================== */

        .work-video {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            border: none;

            border-radius: 12px;

            background: #000;

        }


        /* ==================================================
           ESTADO VAZIO
        ================================================== */

        .empty-state {

            padding: 50px 25px;

            text-align: center;

            background:
                var(--card);

            border-radius: 18px;

            border: 1px solid
                rgba(255,255,255,.05);

        }


        .empty-state h1 {

            color:
                var(--blue-light);

            font-size: 25px;

            margin-bottom: 12px;

        }


        .empty-state p {

            color:
                var(--text-muted);

            font-size: 16px;

        }


        /* ==================================================
           MENU DIREITO
        ================================================== */

        .right-sidebar {

            padding-top: 10px;

        }


        .filter-title {

            color: #aebdca;

            font-size: 14px;
            font-weight: bold;

            margin-bottom: 12px;

        }


        .filter-button {

            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 14px 10px;

            margin-bottom: 8px;

            background: transparent;

            color: #aebdca;

            font-size: 14px;
            font-weight: bold;

            text-align: left;

            cursor: pointer;

            transition:
                background .2s,
                color .2s;

        }


        .filter-button:hover {

            background:
                rgba(8,120,209,.12);

            color: white;

        }


        .filter-button.active {

            background:
                rgba(0,168,137,.18);

            color:
                #4edabd;

        }


        /* ==================================================
           MODAL ADMIN
        ================================================== */

        .admin-modal {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.72);

            z-index: 1000;

        }


        .admin-modal.visible {

            display: flex;

        }


        .admin-modal-box {

            width: 100%;

            max-width: 400px;

            padding: 28px;

            background:
                #111313;

            border: 1px solid
                var(--border);

            border-radius: 18px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.5);

        }


        .admin-modal-box h2 {

            color:
                var(--blue-light);

            font-size: 24px;

            margin-bottom: 8px;

        }


        .admin-login-description {

            color:
                var(--text-muted);

            font-size: 14px;

            margin-bottom: 22px;

        }


        .admin-modal-box label {

            display: block;

            margin-top: 13px;

            margin-bottom: 7px;

            color: #b8c8d7;

            font-size: 14px;
            font-weight: bold;

        }


        .admin-modal-box input {

            width: 100%;

            height: 46px;

            padding: 0 13px;

        }


        /* ==================================================
           BOTÕES MODAL
        ================================================== */

        .admin-modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 22px;

        }


        .admin-modal-buttons button {

            flex: 1;

            border: none;
            border-radius: 9px;

            padding: 13px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

        }


        #cancelAdminLogin {

            background:
                #272b2c;

            color:
                #b7c3cc;

        }


        #cancelAdminLogin:hover {

            background:
                #323738;

        }


        #confirmAdminLogin {

            background:
                linear-gradient(
                    100deg,
                    var(--blue),
                    var(--green)
                );

            color: white;

        }


        #confirmAdminLogin:hover {

            filter: brightness(1.08);

        }


        /* ==================================================
           CONTROLES ADMIN
        ================================================== */

        .admin-controls {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 20px;

            padding-top: 16px;

            border-top: 1px solid
                var(--border);

        }


        .admin-controls button {

            border: none;

            border-radius: 8px;

            padding: 10px 15px;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform .15s,
                filter .15s;

        }


        .admin-controls button:hover {

            transform: translateY(-1px);

            filter: brightness(1.1);

        }


        .approve-button {

            background:
                #008f76;

            color: white;

        }


        .edit-button {

            background:
                #0878d1;

            color: white;

        }


        .delete-button {

            background:
                var(--danger);

            color: white;

        }


        /* ==================================================
           STATUS PENDENTE
        ================================================== */

        .pending-badge {

            display: inline-block;

            margin-bottom: 15px;

            padding: 7px 10px;

            border-radius: 7px;

            background:
                rgba(240,180,41,.10);

            color:
                var(--warning);

            font-size: 13px;
            font-weight: bold;

        }


        /* ==================================================
           RESPONSIVIDADE
        ================================================== */

        @media (max-width: 900px) {

            .layout {

                grid-template-columns:
                    150px
                    minmax(0,1fr)
                    150px;

                gap: 15px;

                padding: 20px;

            }


            .school-logo img {

                max-width: 190px;

            }


            .admin-button {

                padding: 12px 18px;

                font-size: 14px;

            }

        }


        /* ==================================================
           TABLET / CELULAR
        ================================================== */

        @media (max-width: 700px) {

            .topbar {

                height: auto;

                min-height: 90px;

                padding: 10px 18px;

                gap: 12px;

            }


            .school-logo {

                height: 65px;

            }


            .school-logo img {

                height: 60px;

                max-width: 150px;

            }


            .admin-button {

                padding: 11px 15px;

                font-size: 12px;

            }


            .layout {

                display: flex;

                flex-direction: column;

                padding: 15px;

            }


            .left-sidebar {

                order: 1;

                padding: 0;

            }


            .main-navigation {

                display: grid;

                grid-template-columns:
                    repeat(3,1fr);

                gap: 7px;

            }


            .nav-button {

                padding: 13px 6px;

                font-size: 13px;

                text-align: center;

            }


            .main-content {

                order: 2;

            }


            .right-sidebar {

                order: 3;

                padding: 0;

            }


            .right-sidebar {

                display: grid;

                grid-template-columns:
                    repeat(3,1fr);

                gap: 7px;

            }


            .filter-title {

                grid-column:
                    1 / -1;

                margin-top: 5px;

            }


            .filter-button {

                margin: 0;

                text-align: center;

                font-size: 12px;

            }


            .work-card {

                padding: 18px;

            }


            .work-header {

                align-items: flex-start;

                flex-direction: column;

            }


            .work-type {

                align-self: flex-start;

            }


            .type-buttons {

                grid-template-columns:
                    1fr;

            }

        }


        /* ==================================================
           CELULARES PEQUENOS
        ================================================== */

        @media (max-width: 450px) {

            .topbar {

                flex-direction: column;

                justify-content: center;

            }


            .school-logo img {

                max-width: 180px;

            }


            .admin-button {

                width: 100%;

            }


            .work-form {

                padding: 18px;

            }


            .admin-modal-box {

                padding: 20px;

            }


            .admin-controls {

                flex-direction: column;

            }


            .admin-controls button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         TOPO
    ================================================== -->

    <header class="topbar">


        <div class="school-logo">

            <img
                src="logo da escola.png"
                alt="Logo da escola"
            >

        </div>


        <button
            class="admin-button"
            id="adminButton"
        >
            Entrar como administrador
        </button>

    </header>



    <!-- ==================================================
         ESTRUTURA PRINCIPAL
    ================================================== -->

    <main class="layout">


        <!-- ==================================================
             MENU ESQUERDO
        ================================================== -->

        <aside class="left-sidebar">

            <nav class="main-navigation">


                <button
                    class="nav-button active"
                    id="homeButton"
                >
                    Início
                </button>


                <button
                    class="nav-button"
                    id="statisticsButton"
                >
                    Estatísticas
                </button>


                <button
                    class="nav-button"
                    id="instructionsButton"
                >
                    Instruções
                </button>


            </nav>

        </aside>



        <!-- ==================================================
             CONTEÚDO CENTRAL
        ================================================== -->

        <section class="main-content">


            <!-- ADICIONAR TRABALHO -->

            <button
                class="add-work-button"
                id="addWorkButton"
            >
                + Adicionar Trabalho
            </button>



            <!-- FORMULÁRIO -->

            <div
                class="work-form"
                id="workForm"
            >


                <h2>
                    Adicionar Trabalho
                </h2>


                <!-- TIPO -->

                <div class="form-section">

                    <label>
                        Tipo de trabalho
                    </label>


                    <div class="type-buttons">


                        <button
                            type="button"
                            class="type-button"
                            data-type="texto"
                        >
                            📝 Texto
                        </button>


                        <button
                            type="button"
                            class="type-button"
                            data-type="video"
                        >
                            ▶️ Vídeo
                        </button>


                    </div>

                </div>



                <!-- CAMPOS -->

                <div
                    class="work-fields"
                    id="workFields"
                >


                    <!-- NOME -->

                    <div class="form-section">

                        <label
                            for="studentName"
                        >
                            Seu nome
                        </label>


                        <select
                            id="studentName"
                        >

                            <option value="">
                                Selecione seu nome
                            </option>

                            <option value="Aluno A">Aluno A</option>
                            <option value="Aluno B">Aluno B</option>
                            <option value="Aluno C">Aluno C</option>
                            <option value="Aluno D">Aluno D</option>
                            <option value="Aluno E">Aluno E</option>
                            <option value="Aluno F">Aluno F</option>
                            <option value="Aluno G">Aluno G</option>
                            <option value="Aluno H">Aluno H</option>
                            <option value="Aluno I">Aluno I</option>
                            <option value="Aluno J">Aluno J</option>
                            <option value="Aluno K">Aluno K</option>
                            <option value="Aluno L">Aluno L</option>
                            <option value="Aluno M">Aluno M</option>
                            <option value="Aluno N">Aluno N</option>
                            <option value="Aluno O">Aluno O</option>
                            <option value="Aluno P">Aluno P</option>
                            <option value="Aluno Q">Aluno Q</option>
                            <option value="Aluno R">Aluno R</option>
                            <option value="Aluno S">Aluno S</option>
                            <option value="Aluno T">Aluno T</option>
                            <option value="Aluno U">Aluno U</option>
                            <option value="Aluno V">Aluno V</option>
                            <option value="Aluno W">Aluno W</option>
                            <option value="Aluno X">Aluno X</option>
                            <option value="Aluno Y">Aluno Y</option>
                            <option value="Aluno Z">Aluno Z</option>

                        </select>

                    </div>



                    <!-- TEXTO -->

                    <div
                        class="form-section"
                        id="textField"
                    >

                        <label
                            for="textContent"
                        >
                            Trabalho
                        </label>


                        <textarea
                            id="textContent"
                            placeholder="Digite o seu trabalho..."
                        ></textarea>

                    </div>



                    <!-- VÍDEO -->

                    <div
                        class="form-section"
                        id="videoField"
                    >

                        <label
                            for="videoUrl"
                        >
                            URL do vídeo do YouTube
                        </label>


                        <input
                            type="url"
                            id="videoUrl"
                            placeholder="https://www.youtube.com/watch?v=..."
                        >

                    </div>



                    <!-- PUBLICAR -->

                    <button
                        type="button"
                        class="publish-button"
                        id="publishButton"
                    >
                        Publicar Trabalho
                    </button>


                </div>

            </div>



            <!-- TRABALHOS -->

            <section
                class="works-section"
                id="worksArea"
            >

                <div class="empty-state">

                    <h1>
                        Trabalhos postados
                    </h1>

                    <p>
                        Os trabalhos aprovados aparecerão aqui.
                    </p>

                </div>

            </section>


        </section>



        <!-- ==================================================
             MENU DIREITO
        ================================================== -->

        <aside class="right-sidebar">


            <div class="filter-title">
                Organizar trabalhos
            </div>


            <button
                class="filter-button active"
                data-filter="tempo"
            >
                Por tempo
            </button>


            <button
                class="filter-button"
                data-filter="pessoa"
            >
                Por pessoa
            </button>


            <button
                class="filter-button"
                data-filter="tipo"
            >
                Por tipo de trabalho
            </button>


        </aside>


    </main>



    <!-- ==================================================
         MODAL ADMINISTRADOR
    ================================================== -->

    <div
        class="admin-modal"
        id="adminModal"
    >


        <div class="admin-modal-box">


            <h2>
                Login do administrador
            </h2>


            <p class="admin-login-description">
                Entre com a conta de administrador.
            </p>


            <label for="adminEmail">
                E-mail
            </label>


            <input
                type="email"
                id="adminEmail"
                placeholder="E-mail"
                autocomplete="username"
            >


            <label for="adminPassword">
                Senha
            </label>


            <input
                type="password"
                id="adminPassword"
                placeholder="Senha"
                autocomplete="current-password"
            >


            <div class="admin-modal-buttons">


                <button
                    type="button"
                    id="cancelAdminLogin"
                >
                    Cancelar
                </button>


                <button
                    type="button"
                    id="confirmAdminLogin"
                >
                    Entrar
                </button>


            </div>


        </div>

    </div>



    <!-- ==================================================
         SUPABASE
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script>

        /* ==================================================
           CONFIGURAÇÃO DO SUPABASE
        ================================================== */

        const SUPABASE_URL =
            "https://tcertncsuhrtldeojqfx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_6ojNocYnMs6HKTx6kEmsVQ_x_IbL-1E";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* ==================================================
           ELEMENTOS
        ================================================== */

        const addWorkButton =
            document.getElementById("addWorkButton");

        const workForm =
            document.getElementById("workForm");

        const typeButtons =
            document.querySelectorAll(".type-button");

        const workFields =
            document.getElementById("workFields");

        const textField =
            document.getElementById("textField");

        const videoField =
            document.getElementById("videoField");

        const studentName =
            document.getElementById("studentName");

        const textContent =
            document.getElementById("textContent");

        const videoUrl =
            document.getElementById("videoUrl");

        const publishButton =
            document.getElementById("publishButton");

        const worksArea =
            document.getElementById("worksArea");


        /* ADMIN */

        const adminButton =
            document.getElementById("adminButton");

        const adminModal =
            document.getElementById("adminModal");

        const adminEmail =
            document.getElementById("adminEmail");

        const adminPassword =
            document.getElementById("adminPassword");

        const confirmAdminLogin =
            document.getElementById("confirmAdminLogin");

        const cancelAdminLogin =
            document.getElementById("cancelAdminLogin");



        /* ==================================================
           VARIÁVEIS
        ================================================== */

        let selectedType = null;

        let isAdmin = false;



        console.log("Sistema carregado.");

        console.log(
            "Supabase:",
            supabaseClient
        );



        /* ==================================================
           MENU ESQUERDO
        ================================================== */

        const navButtons =
            document.querySelectorAll(
                ".nav-button"
            );


        navButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    navButtons.forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                    button.classList.add(
                        "active"
                    );

                }
            );

        });



        /* ==================================================
           MENU DIREITO
        ================================================== */

        const filterButtons =
            document.querySelectorAll(
                ".filter-button"
            );


        filterButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    filterButtons.forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                    button.classList.add(
                        "active"
                    );

                }
            );

        });



        /* ==================================================
           ADICIONAR TRABALHO
        ================================================== */

        if (addWorkButton) {

            addWorkButton.addEventListener(
                "click",
                () => {

                    workForm.classList.toggle(
                        "visible"
                    );

                }
            );

        }



        /* ==================================================
           ESCOLHER TIPO
        ================================================== */

        typeButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    typeButtons.forEach(item => {

                        item.classList.remove(
                            "selected"
                        );

                    });


                    button.classList.add(
                        "selected"
                    );


                    selectedType =
                        button.dataset.type;


                    workFields.classList.add(
                        "visible"
                    );


                    if (
                        selectedType === "texto"
                    ) {

                        textField.classList.add(
                            "visible"
                        );

                        videoField.classList.remove(
                            "visible"
                        );

                    }


                    if (
                        selectedType === "video"
                    ) {

                        videoField.classList.add(
                            "visible"
                        );

                        textField.classList.remove(
                            "visible"
                        );

                    }

                }
            );

        });



        /* ==================================================
           PUBLICAR
        ================================================== */

        publishButton.addEventListener(
            "click",
            publicarTrabalho
        );


        async function publicarTrabalho() {


            if (!selectedType) {

                alert(
                    "Escolha o tipo de trabalho."
                );

                return;

            }


            const nome =
                studentName.value;


            if (!nome) {

                alert(
                    "Selecione seu nome."
                );

                return;

            }


            let conteudo = "";


            if (
                selectedType === "texto"
            ) {

                conteudo =
                    textContent.value.trim();


                if (!conteudo) {

                    alert(
                        "Digite o conteúdo do trabalho."
                    );

                    return;

                }

            }


            if (
                selectedType === "video"
            ) {

                conteudo =
                    videoUrl.value.trim();


                if (!conteudo) {

                    alert(
                        "Digite a URL do vídeo."
                    );

                    return;

                }


                if (
                    !conteudo.includes("youtube.com") &&
                    !conteudo.includes("youtu.be")
                ) {

                    alert(
                        "Digite uma URL válida do YouTube."
                    );

                    return;

                }

            }


            publishButton.disabled = true;

            publishButton.textContent =
                "Publicando...";


            try {

                const {
                    error
                } = await supabaseClient
                    .from("trabalhos")
                    .insert({

                        nome: nome,

                        tipo: selectedType,

                        conteudo: conteudo,

                        aprovado: false

                    });


                if (error) {

                    console.error(
                        "Erro ao publicar:",
                        error
                    );

                    alert(
                        "Não foi possível publicar o trabalho.\n\n" +
                        error.message
                    );

                    return;

                }


                alert(
                    "Trabalho enviado para aprovação!"
                );


                limparFormulario();

                await carregarTrabalhos();

            }


            catch (error) {

                console.error(
                    "Erro:",
                    error
                );

                alert(
                    "Ocorreu um erro ao publicar o trabalho."
                );

            }


            finally {

                publishButton.disabled =
                    false;

                publishButton.textContent =
                    "Publicar Trabalho";

            }

        }



        /* ==================================================
           LIMPAR FORMULÁRIO
        ================================================== */

        function limparFormulario() {

            studentName.value = "";

            textContent.value = "";

            videoUrl.value = "";

            selectedType = null;


            typeButtons.forEach(button => {

                button.classList.remove(
                    "selected"
                );

            });


            workFields.classList.remove(
                "visible"
            );


            textField.classList.remove(
                "visible"
            );


            videoField.classList.remove(
                "visible"
            );

        }



        /* ==================================================
           LOGIN ADMIN
        ================================================== */

        adminButton.addEventListener(
            "click",
            abrirLoginAdmin
        );


        function abrirLoginAdmin() {

            if (isAdmin) {

                sairAdministrador();

                return;

            }


            adminModal.classList.add(
                "visible"
            );


            adminEmail.focus();

        }



        /* ==================================================
           CANCELAR LOGIN
        ================================================== */

        cancelAdminLogin.addEventListener(
            "click",
            () => {

                adminModal.classList.remove(
                    "visible"
                );

            }
        );



        /* ==================================================
           LOGIN
        ================================================== */

        confirmAdminLogin.addEventListener(
            "click",
            fazerLoginAdmin
        );


        async function fazerLoginAdmin() {

            const email =
                adminEmail.value.trim();

            const senha =
                adminPassword.value;


            if (!email || !senha) {

                alert(
                    "Digite o e-mail e a senha."
                );

                return;

            }


            confirmAdminLogin.disabled = true;

            confirmAdminLogin.textContent =
                "Entrando...";


            try {

                const {
                    data,
                    error
                } = await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: senha

                    });


                if (error) {

                    console.error(
                        "Erro de login:",
                        error
                    );

                    alert(
                        "E-mail ou senha incorretos."
                    );

                    return;

                }


                if (data.session) {

                    isAdmin = true;


                    adminModal.classList.remove(
                        "visible"
                    );


                    adminEmail.value = "";

                    adminPassword.value = "";


                    adminButton.textContent =
                        "Sair do administrador";


                    await carregarTrabalhos();

                }

            }


            catch (error) {

                console.error(error);

                alert(
                    "Não foi possível realizar o login."
                );

            }


            finally {

                confirmAdminLogin.disabled =
                    false;

                confirmAdminLogin.textContent =
                    "Entrar";

            }

        }



        /* ==================================================
           SAIR
        ================================================== */

        async function sairAdministrador() {

            await supabaseClient.auth.signOut();

            isAdmin = false;

            adminButton.textContent =
                "Entrar como administrador";

            await carregarTrabalhos();

        }



        /* ==================================================
           VERIFICAR SESSÃO
        ================================================== */

        async function verificarSessao() {

            const {
                data
            } = await supabaseClient.auth.getSession();


            if (data.session) {

                isAdmin = true;

                adminButton.textContent =
                    "Sair do administrador";

            }

        }



        /* ==================================================
           CARREGAR TRABALHOS
        ================================================== */

        async function carregarTrabalhos() {

            try {

                let query =
                    supabaseClient
                        .from("trabalhos")
                        .select("*");


                if (!isAdmin) {

                    query =
                        query.eq(
                            "aprovado",
                            true
                        );

                }


                query =
                    query.order(
                        "id",
                        {
                            ascending: false
                        }
                    );


                const {
                    data,
                    error
                } = await query;


                if (error) {

                    console.error(
                        "Erro ao carregar trabalhos:",
                        error
                    );

                    return;

                }


                renderizarTrabalhos(data);

            }


            catch (error) {

                console.error(
                    "Erro:",
                    error
                );

            }

        }



        /* ==================================================
           RENDERIZAR TRABALHOS
        ================================================== */

        function renderizarTrabalhos(trabalhos) {

            worksArea.innerHTML = "";


            if (
                !trabalhos ||
                trabalhos.length === 0
            ) {

                if (isAdmin) {

                    worksArea.innerHTML = `

                        <div class="empty-state">

                            <h1>
                                Nenhum trabalho encontrado
                            </h1>

                            <p>
                                Não existem trabalhos publicados ou pendentes.
                            </p>

                        </div>

                    `;

                }

                else {

                    worksArea.innerHTML = `

                        <div class="empty-state">

                            <h1>
                                Trabalhos postados
                            </h1>

                            <p>
                                Os trabalhos aprovados aparecerão aqui.
                            </p>

                        </div>

                    `;

                }


                return;

            }


            trabalhos.forEach(trabalho => {


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "work-card";


                /* CABEÇALHO */

                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "work-header";


                const info =
                    document.createElement(
                        "div"
                    );


                const author =
                    document.createElement(
                        "div"
                    );


                author.className =
                    "work-author";


                author.textContent =
                    trabalho.nome;


                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "work-date";


                date.textContent =
                    "ID do trabalho: #" +
                    trabalho.id;


                info.appendChild(author);

                info.appendChild(date);


                /* TIPO */

                const type =
                    document.createElement(
                        "div"
                    );


                type.className =
                    "work-type";


                if (
                    trabalho.tipo === "texto"
                ) {

                    type.textContent =
                        "📝 Texto";

                }

                else {

                    type.textContent =
                        "▶️ Vídeo";

                }


                header.appendChild(info);

                header.appendChild(type);

                card.appendChild(header);



                /* STATUS */

                if (
                    isAdmin &&
                    !trabalho.aprovado
                ) {

                    const status =
                        document.createElement(
                            "div"
                        );


                    status.className =
                        "pending-badge";


                    status.textContent =
                        "⏳ Aguardando aprovação";


                    card.appendChild(status);

                }



                /* TEXTO */

                if (
                    trabalho.tipo === "texto"
                ) {

                    const texto =
                        document.createElement(
                            "div"
                        );


                    texto.className =
                        "work-text";


                    texto.textContent =
                        trabalho.conteudo;


                    card.appendChild(texto);

                }



                /* VÍDEO */

                if (
                    trabalho.tipo === "video"
                ) {

                    const iframe =
                        document.createElement(
                            "iframe"
                        );


                    iframe.className =
                        "work-video";


                    iframe.src =
                        transformarYoutubeUrl(
                            trabalho.conteudo
                        );


                    iframe.title =
                        "Vídeo do trabalho";


                    iframe.allow =
                        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";


                    iframe.allowFullscreen =
                        true;


                    card.appendChild(iframe);

                }



                /* ADMIN */

                if (isAdmin) {

                    criarControlesAdmin(
                        card,
                        trabalho
                    );

                }


                worksArea.appendChild(card);

            });

        }



        /* ==================================================
           CONTROLES ADMIN
        ================================================== */

        function criarControlesAdmin(
            card,
            trabalho
        ) {

            const controls =
                document.createElement(
                    "div"
                );


            controls.className =
                "admin-controls";


            if (
                !trabalho.aprovado
            ) {

                const approveButton =
                    document.createElement(
                        "button"
                    );


                approveButton.className =
                    "approve-button";


                approveButton.textContent =
                    "Aprovar";


                approveButton.addEventListener(
                    "click",
                    async () => {

                        await aprovarTrabalho(
                            trabalho.id
                        );

                    }
                );


                controls.appendChild(
                    approveButton
                );

            }



            /* EDITAR */

            const editButton =
                document.createElement(
                    "button"
                );


            editButton.className =
                "edit-button";


            editButton.textContent =
                "Editar";


            editButton.addEventListener(
                "click",
                async () => {

                    await editarTrabalho(
                        trabalho
                    );

                }
            );


            controls.appendChild(editButton);



            /* APAGAR */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "delete-button";


            deleteButton.textContent =
                "Apagar";


            deleteButton.addEventListener(
                "click",
                async () => {

                    await apagarTrabalho(
                        trabalho.id
                    );

                }
            );


            controls.appendChild(
                deleteButton
            );


            card.appendChild(
                controls
            );

        }



        /* ==================================================
           APROVAR
        ================================================== */

        async function aprovarTrabalho(id) {

            const confirmar =
                confirm(
                    "Deseja aprovar este trabalho?"
                );


            if (!confirmar) {

                return;

            }


            try {

                const {
                    error
                } = await supabaseClient
                    .from("trabalhos")
                    .update({

                        aprovado: true

                    })
                    .eq(
                        "id",
                        id
                    );


                if (error) {

                    console.error(error);

                    alert(
                        "Não foi possível aprovar o trabalho."
                    );

                    return;

                }


                await carregarTrabalhos();

            }


            catch (error) {

                console.error(error);

                alert(
                    "Ocorreu um erro."
                );

            }

        }



        /* ==================================================
           EDITAR
        ================================================== */

        async function editarTrabalho(trabalho) {


            const novoNome =
                prompt(
                    "Nome do aluno:",
                    trabalho.nome
                );


            if (novoNome === null) {

                return;

            }


            if (
                novoNome.trim() === ""
            ) {

                alert(
                    "O nome não pode ficar vazio."
                );

                return;

            }


            const novoConteudo =
                prompt(
                    trabalho.tipo === "video"
                        ? "URL do vídeo do YouTube:"
                        : "Conteúdo do trabalho:",
                    trabalho.conteudo
                );


            if (novoConteudo === null) {

                return;

            }


            if (
                novoConteudo.trim() === ""
            ) {

                alert(
                    "O conteúdo não pode ficar vazio."
                );

                return;

            }


            if (
                trabalho.tipo === "video" &&
                !novoConteudo.includes("youtube.com") &&
                !novoConteudo.includes("youtu.be")
            ) {

                alert(
                    "Digite uma URL válida do YouTube."
                );

                return;

            }


            try {

                const {
                    error
                } = await supabaseClient
                    .from("trabalhos")
                    .update({

                        nome:
                            novoNome.trim(),

                        conteudo:
                            novoConteudo.trim()

                    })
                    .eq(
                        "id",
                        trabalho.id
                    );


                if (error) {

                    console.error(error);

                    alert(
                        "Não foi possível editar o trabalho."
                    );

                    return;

                }


                alert(
                    "Trabalho editado com sucesso!"
                );


                await carregarTrabalhos();

            }


            catch (error) {

                console.error(error);

                alert(
                    "Ocorreu um erro ao editar."
                );

            }

        }



        /* ==================================================
           APAGAR
        ================================================== */

        async function apagarTrabalho(id) {

            const confirmar =
                confirm(
                    "Tem certeza que deseja apagar este trabalho?\n\nEssa ação não pode ser desfeita."
                );


            if (!confirmar) {

                return;

            }


            try {

                const {
                    error
                } = await supabaseClient
                    .from("trabalhos")
                    .delete()
                    .eq(
                        "id",
                        id
                    );


                if (error) {

                    console.error(error);

                    alert(
                        "Não foi possível apagar o trabalho."
                    );

                    return;

                }


                await carregarTrabalhos();

            }


            catch (error) {

                console.error(error);

                alert(
                    "Ocorreu um erro ao apagar."
                );

            }

        }



        /* ==================================================
           YOUTUBE
        ================================================== */

        function transformarYoutubeUrl(url) {

            try {

                const endereco =
                    new URL(url);


                let id = "";


                if (
                    endereco.hostname.includes(
                        "youtu.be"
                    )
                ) {

                    id =
                        endereco.pathname.substring(
                            1
                        );

                }


                if (
                    endereco.hostname.includes(
                        "youtube.com"
                    )
                ) {

                    id =
                        endereco.searchParams.get(
                            "v"
                        );


                    if (
                        !id &&
                        endereco.pathname.startsWith(
                            "/shorts/"
                        )
                    ) {

                        id =
                            endereco.pathname
                                .split("/")[2];

                    }

                }


                if (!id) {

                    return url;

                }


                return (
                    "https://www.youtube.com/embed/" +
                    id
                );

            }


            catch {

                return url;

            }

        }



        /* ==================================================
           INICIAR SISTEMA
        ================================================== */

        async function iniciarSistema() {

            await verificarSessao();

            await carregarTrabalhos();

        }


        iniciarSistema();

    </script>

</body>

</html>
