<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trabalhos Escolares</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOPO -->
    <header class="topbar">

        <div class="school-logo">
            LOGO DA ESCOLA
        </div>

        <button class="admin-button">
            Entrar como administrador
        </button>

    </header>


    <!-- ESTRUTURA PRINCIPAL -->
    <div class="page-layout">

        <!-- MENU ESQUERDO -->
        <aside class="left-sidebar">

            <nav class="main-nav">

                <button class="nav-button active">
                    Início
                </button>

                <button class="nav-button">
                    Estatísticas
                </button>

                <button class="nav-button">
                    Instruções
                </button>

            </nav>

        </aside>


        <!-- CONTEÚDO CENTRAL -->
        <main class="content">

            <!-- BOTÃO ADICIONAR -->
            <section class="add-work-area">

                <button class="add-work-button">
                    <span class="plus">+</span>
                    Adicionar Trabalho
                </button>

            </section>


            <!-- TRABALHOS -->
            <section class="works-area">

                <div class="empty-state">

                    <h1>
                        Trabalhos postados
                    </h1>

                    <p>
                        Os trabalhos aparecerão aqui.
                    </p>

                </div>

            </section>

        </main>


        <!-- MENU DIREITO -->
        <aside class="right-sidebar">

            <div class="organize-title">
                Organizar trabalhos
            </div>

            <nav class="organize-nav">

                <button class="filter-button active">
                    Por tempo
                </button>

                <button class="filter-button">
                    Por pessoa
                </button>

                <button class="filter-button">
                    Por tipo de trabalho
                </button>

            </nav>

        </aside>

    </div>


    <script src="script.js"></script>

</body>

</html>
